name: tapa_budget
description: TAPA Invest - Votre coach financier intelligent
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  flutter_dotenv: ^5.1.0

  firebase_core: ^3.8.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.3.3
  firebase_storage: ^12.3.6
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.0.3
  firebase_messaging: ^15.1.3

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^13.2.0

  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  http: ^1.2.2
  dio: ^5.3.2
  dio_smart_retry: ^5.0.0
  crypto: ^3.0.3

  uuid: ^4.4.0
  equatable: ^2.0.5
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  image: ^4.2.0

  printing: ^5.12.0
  pdf: ^3.10.9

  image_picker: ^1.1.2
  speech_to_text: ^6.6.0
  camera: ^0.10.5+9
  permission_handler: ^11.3.1

  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.4

  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_commons: ^0.11.0

  pinput: ^6.0.2
  dart_style: ^2.3.7
  flutter_custom_tabs: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/logos/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_tapa_invest.png"
  adaptive_icon_background: "#0D2B4E"
  adaptive_icon_foreground: "assets/logos/logo_tapa_invest.png"
  remove_alpha_ios: true
